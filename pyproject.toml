[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "medrobots-api"
version = "0.1.0"
description = "Contact API for Med Robots"
requires-python = ">=3.14"

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "email-validator>=2.2,<3",
    "SQLAlchemy>=2.0.40,<3",
    "alembic>=1.15,<2",
    "psycopg[binary]>=3.2,<4",
    "slowapi>=0.1.10,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
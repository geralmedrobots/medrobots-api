services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: medrobots
      POSTGRES_USER: medrobots
      POSTGRES_PASSWORD: medrobots
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medrobots -d medrobots"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off migration step, run to completion before the api service starts.
  # This mirrors how migrations should run in production: as an explicit,
  # single step ahead of rolling out application instances, not embedded in
  # every container start (which would race when scaled to multiple replicas).
  migrate:
    build: .
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://medrobots:medrobots@db:5432/medrobots
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1:4173
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  api:
    build: .
    environment:
      APP_NAME: Med Robots API
      APP_VERSION: 0.1.0
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://medrobots:medrobots@db:5432/medrobots
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1:4173
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
